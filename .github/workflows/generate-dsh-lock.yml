name: Generate DSH lock candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact DSH version; empty selects highest published SemVer including prereleases
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: dsh-lock-candidate
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: windows-2022
    outputs:
      base: ${{ steps.freeze.outputs.base }}
      version: ${{ steps.freeze.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          persist-credentials: false
      - name: Freeze actual dev commit and official version
        id: freeze
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $selection = Join-Path $env:RUNNER_TEMP 'selection.json'
          node tools/dsh-candidate.mjs resolve . "$env:REQUESTED_VERSION" $selection
          if ($LASTEXITCODE -ne 0) { throw 'Selection failed' }
          $value = Get-Content -LiteralPath $selection -Raw | ConvertFrom-Json
          "base=$($value.baseCommitSha)" >> $env:GITHUB_OUTPUT
          "version=$($value.version)" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v6
        with:
          name: dsh-selection
          path: ${{ runner.temp }}/selection.json
          retention-days: 30

  generate:
    needs: resolve
    # Disposable runner with a compiler; NOT clean-user acceptance.
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      DSH_VERSION: ${{ needs.resolve.outputs.version }}
      BASE_COMMIT: ${{ needs.resolve.outputs.base }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.base }}
          persist-credentials: false
      - name: Verify checkout and credential boundary
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:BASE_COMMIT) { throw 'Base drift' }
          if ($env:GITHUB_TOKEN -or $env:GH_TOKEN -or $env:NPM_TOKEN -or $env:NODE_AUTH_TOKEN) {
            throw 'Generator must not receive repository or npm credentials'
          }
          $auth = git config --local --get-regexp '^(http\..*extraheader|credential\.)' 2>$null
          if ($LASTEXITCODE -notin 0, 1 -or $auth) { throw 'Checkout credential inspection failed' }
          $global:LASTEXITCODE = 0
      - name: Generate and smoke frozen version
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/generate-dsh-lock.ps1 -Version $env:DSH_VERSION -Isolated -TimeoutMinutes 60
          if ($LASTEXITCODE -ne 0) { throw 'Generation failed' }
      - name: Export data only (never workspace diffs or scripts)
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'dsh-data'
          New-Item -ItemType Directory -Path $target | Out-Null
          $source = Join-Path 'tools/dsh-locks/locks' $env:DSH_VERSION
          foreach ($file in @('package.json', 'package-lock.json')) {
            Copy-Item -LiteralPath (Join-Path $source $file) -Destination $target
          }
          Copy-Item -LiteralPath tools/dsh-locks/catalog.json -Destination $target
          Copy-Item -LiteralPath tools/dsh-seed/.npmrc -Destination (Join-Path $target 'npmrc')
      - uses: actions/upload-artifact@v6
        with:
          name: dsh-untrusted-data
          path: ${{ runner.temp }}/dsh-data/
          retention-days: 7
          if-no-files-found: error

  prepare:
    needs: [resolve, generate]
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.base }}
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: dsh-selection
          path: ${{ runner.temp }}/selection
      - uses: actions/download-artifact@v5
        with:
          name: dsh-untrusted-data
          path: ${{ runner.temp }}/dsh-data
      - name: Reconstruct candidate from trusted base and validated data
        shell: pwsh
        run: |
          node tools/dsh-candidate.mjs prepare . "$env:RUNNER_TEMP/dsh-data" "$env:RUNNER_TEMP/selection/selection.json" "$env:RUNNER_TEMP/dsh-candidate"
          if ($LASTEXITCODE -ne 0) { throw 'Candidate validation failed' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Patch whitespace validation failed' }
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - name: Validate candidate (sequential Fast gate)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/test.ps1 -Suite Fast
          if ($LASTEXITCODE -ne 0) { throw 'Candidate Fast gate failed' }
      - name: Build frozen candidate ZIP and record its identity
        shell: powershell
        run: |
          $packages = Join-Path $env:RUNNER_TEMP 'dsh-candidate/packages'
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/build-release.ps1 -PinRuntimes -OutputDirectory $packages
          if ($LASTEXITCODE -ne 0) { throw 'Candidate package build failed' }
          $zip = @(Get-ChildItem -LiteralPath $packages -Filter '*.zip')
          if ($zip.Count -ne 1) { throw 'Expected one candidate ZIP' }
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/record-dsh-package.ps1 -Mode Candidate -Package $zip[0].FullName -Report "$env:RUNNER_TEMP/dsh-candidate/candidate.json"
          if ($LASTEXITCODE -ne 0) { throw 'Package identity recording failed' }
      - uses: actions/upload-artifact@v6
        with:
          name: dsh-candidate-${{ needs.resolve.outputs.version }}
          path: ${{ runner.temp }}/dsh-candidate/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: dsh-candidate-test-reports
          path: |
            TestResults/dotnet/**/*.trx
            TestResults/web/test-summary.json
          retention-days: 30
          if-no-files-found: ignore
