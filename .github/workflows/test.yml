name: Tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      npm_config_cache: ${{ github.workspace }}\TestResults\npm-cache

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: tests/PSX.Web.Tests/package-lock.json

      - name: Run fast test suite
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File tools/test.ps1 -Suite Fast

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: ignore
          retention-days: 14
