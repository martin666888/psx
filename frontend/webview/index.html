<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>PSX Terminal</title>
</head>
<body>
    <div id="workspace-stack" class="agent-ui">
        <nav id="activity-rail" aria-label="全局操作">
            <button type="button" class="workspace-chrome-button" data-role="history-toggle" aria-label="历史记录" title="历史记录">☰</button>
            <button type="button" class="workspace-chrome-button" data-role="workspace-menu-toggle" aria-label="工作区" title="工作区" aria-haspopup="dialog" aria-expanded="false">▦</button>
            <button type="button" class="workspace-chrome-button" data-role="workspace-create-toggle" aria-label="新建工作区" aria-haspopup="dialog" aria-expanded="false">＋</button>
            <button type="button" class="workspace-chrome-button" data-role="theme-toggle" aria-label="主题" title="Theme" aria-haspopup="dialog" aria-expanded="false">◐</button>
        </nav>
        <header id="workspace-chrome" aria-label="工作区导航">
            <div class="workspace-nameplates" data-role="pane-nameplates"></div>
        </header>
        <div id="terminal-container"></div>
        <div id="agent-workspace-container"></div>
        <div id="workspace-panes"></div>
        <div id="workspace-popover-root"></div>
        <div id="global-portal-root" class="agent-ui"></div>
        <div id="workspace-notices" role="status" aria-live="polite"></div>
    </div>
    <template id="agent-workspace-template">
    <section class="agent-panel" hidden>
        <header class="agent-toolbar">
            <div data-role="toolbar-host" class="agent-toolbar-host"></div>
        </header>
        <div data-role="runtime-host" class="agent-runtime-react-host"></div>
        <div class="agent-workspace">
            <div data-role="conversation-host" class="agent-conversation-host"></div>
        </div>

                <aside data-role="context-cards" class="agent-context-cards" aria-label="Agent context cards">
            <section data-role="plan-card" class="agent-plan-card" aria-label="Agent plan"></section>
        </aside>
        <footer class="agent-composer">
            <div data-role="composer-host" class="agent-composer-host"></div>
        </footer>
    </section>
    </template>

    <script>
        window.onerror = function(msg, src, line, col, err) {
            var d = document.createElement('pre');
            d.className = 'agent-native-scroll';
            d.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#f38ba8;color:#1e1e2e;font-size:12px;padding:8px;z-index:9999;white-space:pre-wrap;max-height:40vh;overflow:auto';
            d.textContent = '[JS ERROR] ' + msg + '\n  at ' + src + ':' + line + ':' + col + (err ? '\n' + err.stack : '');
            document.body.appendChild(d);
            return false;
        };
        window.addEventListener('unhandledrejection', function(e) {
            window.onerror('Unhandled Promise: ' + e.reason, '', 0, 0, e.reason instanceof Error ? e.reason : null);
        });
    </script>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
