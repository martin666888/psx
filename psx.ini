; PSX 核心活动配置文件，由程序维护，请勿直接修改主题字段。
; 自定义颜色和字体请编辑用户主题文件；高级非主题设置可谨慎修改。
; 使用方法：关闭 PSX，把本文件复制到上一级目录，并重命名为 psx.ini，然后重新启动。
; 注意：PSX 实际只读取上一级目录的 psx.ini，本文件只是模板。

[meta]
kind=active-config
schemaVersion=1
activeThemeKey=builtin:vercel-neutral-dark
themeFingerprint=

[terminal]
; 终端字体大小，影响 Terminal 面板里的 xterm 字号。
fontSize=14
; 终端字体族，建议保留等宽字体在最前面。
fontFamily=Cascadia Code, Consolas, monospace
; 终端历史滚动行数。
scrollback=10000
; 保留字段，目前主题颜色主要由下方 [theme] 和 [terminalColors] 控制。
theme=dark

[agent]
; AI Agent 面板的界面字号。
fontSize=14
; AI Agent 面板的普通 UI 字体。
fontFamily=Segoe UI Variable, Segoe UI, Microsoft YaHei UI, Microsoft YaHei, sans-serif
; AI Agent 面板中代码块、工具输出、输入框使用的等宽字体。
monoFontFamily=Cascadia Code, Consolas, monospace

[shell]
; 新建终端默认使用的 shell 配置。
defaultProfile=powershell

[theme]
; 整体主背景：WPF 内容区、Agent 主背景、Terminal 页面背景。
background=#0a0a0a
; 普通表面：输入框、普通卡片、按钮底色。
surface=#141414
; 抬高表面：工具卡片、弹出层、较突出的面板。
surfaceRaised=#171717
; 弱表面：选中状态、次级块、折叠内容背景。
surfaceMuted=#1f1f1f
; 悬停背景：Tab hover、按钮 hover、列表项 hover。
hover=#262626
; 普通边框：卡片、输入框、分隔线。
border=#262626
; 强边框：聚焦控件、强调卡片、较清晰的轮廓。
borderStrong=#404040
; 主文字：正文、标题、主要按钮文字。
text=#fafafa
; 次级文字：状态、提示、标签。
textMuted=#a3a3a3
; 弱文字：辅助信息、关闭按钮普通态、低优先级提示。
textDim=#737373
; 强调色：运行状态、链接、左侧强调线、主要视觉焦点。
accent=#ededed
; 强调色 hover：链接 hover、强调按钮 hover。
accentHover=#ffffff
; 错误文字色：错误状态、危险提示。
error=#ff6467
; 错误背景色：错误卡片、停止/失败相关背景。
errorBg=#2a1517
; 警告文字色：警告状态、需要注意的信息。
warning=#f5a623
; 警告背景色：警告卡片背景。
warningBg=#2a2113
; 滚动条普通态。
scrollbar=#333333
; 滚动条 hover 态。
scrollbarHover=#454545

[agentTheme]
; Markdown 代码块背景。
codeBlockBg=#111111
; Markdown 代码块文字。
codeBlockText=#ededed
; Markdown 代码块边框。
codeBlockBorder=#262626
; Send 按钮背景。
sendBtn=#ededed
; Send 按钮 hover 背景。
sendBtnHover=#ffffff
; Send / Stop 按钮文字。
sendBtnText=#0a0a0a
; ACP decision primary button background.
decisionPrimary=#ededed
; ACP decision primary button hover background.
decisionPrimaryHover=#ffffff
; ACP decision primary button text.
decisionPrimaryText=#0a0a0a
; Stop 按钮背景。
stopBtn=#57181a
; Stop 按钮 hover 背景。
stopBtnHover=#6b2224
; 权限决策按钮：允许。
allowColor=#62c073
; 权限决策按钮：拒绝。
denyColor=#ff6467
; 权限决策按钮：始终允许/谨慎操作。
cautionColor=#f5a623
; 权限请求卡片背景。
permissionBg=#1a1a1a
; 权限请求卡片边框。
permissionBorder=#404040
; 需要用户输入/选择的 elicitation 卡片背景。
elicitationBg=#151a19
; 需要用户输入/选择的 elicitation 卡片边框。
elicitationBorder=#2e4440
; 图片预览、遮罩层等覆盖色。
overlay=#000000
; 弹出层和菜单阴影色。
shadow=#000000
; 输入框聚焦光环。
focusRing=#737373

[terminalColors]
; 终端默认前景文字色。
foreground=#ededed
; 终端光标颜色。
cursor=#fafafa
; 光标反色文字色。
cursorAccent=#0a0a0a
; 终端选区背景，末尾 66 表示透明度。
selectionBackground=#3f3f4666
; 终端选区文字色。
selectionForeground=#fafafa
; ANSI 基础色：黑。
black=#262626
; ANSI 基础色：红。
red=#ff6467
; ANSI 基础色：绿。
green=#62c073
; ANSI 基础色：黄。
yellow=#f5a623
; ANSI 基础色：蓝。
blue=#52a8ff
; ANSI 基础色：紫。
magenta=#bf7af0
; ANSI 基础色：青。
cyan=#52d2e0
; ANSI 基础色：白。
white=#d4d4d4
; ANSI 高亮色：亮黑/灰。
brightBlack=#525252
; ANSI 高亮色：亮红。
brightRed=#ff8589
; ANSI 高亮色：亮绿。
brightGreen=#7fd48f
; ANSI 高亮色：亮黄。
brightYellow=#ffc058
; ANSI 高亮色：亮蓝。
brightBlue=#75bcff
; ANSI 高亮色：亮紫。
brightMagenta=#d29bf5
; ANSI 高亮色：亮青。
brightCyan=#79dfeb
; ANSI 高亮色：亮白。
brightWhite=#fafafa
