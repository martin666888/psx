; PSX 核心活动配置文件，由程序维护，请勿直接修改主题字段。
; 自定义颜色和字体请编辑用户主题文件；高级非主题设置可谨慎修改。
; 使用方法：关闭 PSX，把本文件复制到上一级目录，并重命名为 psx.ini，然后重新启动。
; 注意：PSX 实际只读取上一级目录的 psx.ini，本文件只是模板。

[meta]
kind=active-config
schemaVersion=1
activeThemeKey=builtin:base-light
themeFingerprint=

[terminal]
; 终端字体大小，影响 Terminal 面板里的 xterm 字号。
fontSize=14
; 终端字体族，建议保留等宽字体在最前面。
fontFamily=Cascadia Code, Consolas, monospace
; 终端历史滚动行数。
scrollback=10000
; 保留字段，目前主题颜色主要由下方 [theme] 和 [terminalColors] 控制。
theme=dark

[agent]
; AI Agent 面板的界面字号。
fontSize=14
; AI Agent 面板的普通 UI 字体。
fontFamily=Segoe UI Variable Text, Segoe UI, Microsoft YaHei UI, Microsoft JhengHei UI, Yu Gothic UI, Meiryo, Segoe UI Emoji, sans-serif
; AI Agent 面板中代码块、工具输出和其他技术内容使用的等宽字体。
monoFontFamily=PSX Maple Mono, Segoe UI Emoji, Microsoft YaHei UI, monospace

[shell]
; 新建终端默认使用的 shell 配置。
defaultProfile=powershell

[theme]
; 整体主背景：WPF 内容区、Agent 主背景、Terminal 页面背景。
background=#ffffff
; 普通表面：输入框、普通卡片、按钮底色。
surface=#fafafa
; 抬高表面：工具卡片、弹出层、较突出的面板。
surfaceRaised=#ffffff
; 弱表面：选中状态、次级块、折叠内容背景。
surfaceMuted=#f5f5f5
; 悬停背景：Tab hover、按钮 hover、列表项 hover。
hover=#f0f0f0
; 普通边框：卡片、输入框、分隔线。
border=#e5e5e5
; 强边框：聚焦控件、强调卡片、较清晰的轮廓。
borderStrong=#d4d4d4
; 主文字：正文、标题、主要按钮文字。
text=#171717
; 次级文字：状态、提示、标签。
textMuted=#737373
; 弱文字：辅助信息、关闭按钮普通态、低优先级提示。
textDim=#a3a3a3
; 强调色：运行状态、链接、左侧强调线、主要视觉焦点。
accent=#171717
; 强调色 hover：链接 hover、强调按钮 hover。
accentHover=#000000
; 错误文字色：错误状态、危险提示。
error=#e7000b
; 错误背景色：错误卡片、停止/失败相关背景。
errorBg=#fdecec
; 警告文字色：警告状态、需要注意的信息。
warning=#a35200
; 警告背景色：警告卡片背景。
warningBg=#fff4e5
; 滚动条普通态。
scrollbar=#d4d4d4
; 滚动条 hover 态。
scrollbarHover=#a3a3a3

[agentTheme]
; Markdown 代码块背景。
codeBlockBg=#fafafa
; Markdown 代码块文字。
codeBlockText=#171717
; Markdown 代码块边框。
codeBlockBorder=#e5e5e5
; Send 按钮背景。
sendBtn=#171717
; Send 按钮 hover 背景。
sendBtnHover=#000000
; Send / Stop 按钮文字。
sendBtnText=#ffffff
; ACP decision primary button background.
decisionPrimary=#171717
; ACP decision primary button hover background.
decisionPrimaryHover=#000000
; ACP decision primary button text.
decisionPrimaryText=#ffffff
; Stop 按钮背景。
stopBtn=#fbdcdd
; Stop 按钮 hover 背景。
stopBtnHover=#f5c2c4
; 权限决策按钮：允许。
allowColor=#297a3a
; 权限决策按钮：拒绝。
denyColor=#e7000b
; 权限决策按钮：始终允许/谨慎操作。
cautionColor=#a35200
; 权限请求卡片背景。
permissionBg=#fafafa
; 权限请求卡片边框。
permissionBorder=#d4d4d4
; 需要用户输入/选择的 elicitation 卡片背景。
elicitationBg=#f4faf9
; 需要用户输入/选择的 elicitation 卡片边框。
elicitationBorder=#cfe5e1
; 图片预览、遮罩层等覆盖色。
overlay=#000000
; 弹出层和菜单阴影色。
shadow=#000000
; 输入框聚焦光环。
focusRing=#1f7a72
; Agent 工作台底色渐变着色（RRGGBBAA，全透明=无着色）。
workbenchTint=#f9f1ebcc

[terminalColors]
; 终端默认前景文字色。
foreground=#171717
; 终端光标颜色。
cursor=#171717
; 光标反色文字色。
cursorAccent=#ffffff
; 终端选区背景，末尾 88 表示透明度。
selectionBackground=#b3d7ff88
; 终端选区文字色。
selectionForeground=#171717
; ANSI 基础色：黑。
black=#000000
; ANSI 基础色：红。
red=#e7000b
; ANSI 基础色：绿。
green=#297a3a
; ANSI 基础色：黄。
yellow=#a35200
; ANSI 基础色：蓝。
blue=#0068d6
; ANSI 基础色：紫。
magenta=#7d00cc
; ANSI 基础色：青。
cyan=#0087a8
; ANSI 基础色：白。
white=#d4d4d4
; ANSI 高亮色：亮黑/灰。
brightBlack=#525252
; ANSI 高亮色：亮红。
brightRed=#ff6467
; ANSI 高亮色：亮绿。
brightGreen=#3fa354
; ANSI 高亮色：亮黄。
brightYellow=#d17d00
; ANSI 高亮色：亮蓝。
brightBlue=#52a8ff
; ANSI 高亮色：亮紫。
brightMagenta=#bf7af0
; ANSI 高亮色：亮青。
brightCyan=#00b3d6
; ANSI 高亮色：亮白。
brightWhite=#fafafa
