; PSX 主题文件（Theme Preset），可在 Theme 菜单中预览并应用。
; Base Light — 新装默认浅色主题：白底 + 冷灰分隔 + 黑色主操作。

[meta]
kind=theme
schemaVersion=1
id=base-light
name=Base Light
author=PSX

[terminal]
fontSize=14
fontFamily=Cascadia Code, Consolas, monospace

[agent]
fontSize=14
fontFamily=Segoe UI Variable Text, Segoe UI, Microsoft YaHei UI, Microsoft JhengHei UI, Yu Gothic UI, Meiryo, Segoe UI Emoji, sans-serif
monoFontFamily=PSX Maple Mono, Segoe UI Emoji, Microsoft YaHei UI, monospace

[theme]
; 整体主背景：WPF 内容区、Agent 主背景、Terminal 页面背景。
background=#ffffff
; 普通表面：输入框、普通卡片、按钮底色。
surface=#f7f7fa
; 抬高表面：工具卡片、弹出层、较突出的面板。
surfaceRaised=#ffffff
; 弱表面：选中状态、次级块、折叠内容背景。
surfaceMuted=#e8ebf0
; 悬停背景：Tab hover、按钮 hover、列表项 hover。
hover=#e8ebf0
; 普通边框：卡片、输入框、分隔线。
border=#dee0e5
; 强边框：聚焦控件、强调卡片、较清晰的轮廓。
borderStrong=#c6c8d0
; 主文字：正文、标题、主要按钮文字。
text=#26292e
; 次级文字：状态、提示、标签。
textMuted=#6e737a
; 弱文字：辅助信息、关闭按钮普通态、低优先级提示。
textDim=#9aa0a8
; 强调色：运行状态、链接、左侧强调线、主要视觉焦点。
accent=#171717
; 强调色 hover：链接 hover、强调按钮 hover。
accentHover=#000000
; 错误文字色：错误状态、危险提示。
error=#e7000b
; 错误背景色：错误卡片、停止/失败相关背景。
errorBg=#fdecec
; 警告文字色：警告状态、需要注意的信息。
warning=#a35200
; 警告背景色：警告卡片背景。
warningBg=#fff4e5
; 滚动条普通态。
scrollbar=#d4d4d4
; 滚动条 hover 态。
scrollbarHover=#a3a3a3

