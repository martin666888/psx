; PSX 主题文件（Theme Preset），可在 Theme 菜单中预览并应用。
; 修改后请刷新主题列表；只有点击“确认使用”才会写入核心配置。
; 使用方法：关闭 PSX，把本文件复制到上一级目录，并重命名为 psx.ini，然后重新启动。
; 注意：PSX 实际只读取上一级目录的 psx.ini，本文件只是模板。

[meta]
kind=theme
schemaVersion=1
id=dark
name=Dark
author=PSX

[terminal]
; 终端字体大小，影响 Terminal 面板里的 xterm 字号。
fontSize=14
; 终端字体族，建议保留等宽字体在最前面。
fontFamily=Cascadia Code, Consolas, monospace
; 终端历史滚动行数。
; 保留字段，目前主题颜色主要由下方 [theme] 和 [terminalColors] 控制。

[agent]
; AI Agent 面板的界面字号。
fontSize=14
; AI Agent 面板的普通 UI 字体。
fontFamily=Segoe UI Variable, Segoe UI, Microsoft YaHei UI, Microsoft YaHei, sans-serif
; AI Agent 面板中代码块、工具输出、输入框使用的等宽字体。
monoFontFamily=Cascadia Code, Consolas, monospace

; 新建终端默认使用的 shell 配置。

[theme]
; 整体主背景：WPF 内容区、Agent 主背景、Terminal 页面背景。
background=#0c0c0d
; 普通表面：输入框、普通卡片、按钮底色。
surface=#141416
; 抬高表面：工具卡片、弹出层、较突出的面板。
surfaceRaised=#1c1c1f
; 弱表面：选中状态、次级块、折叠内容背景。
surfaceMuted=#242429
; 悬停背景：Tab hover、按钮 hover、列表项 hover。
hover=#2a2a30
; 普通边框：卡片、输入框、分隔线。
border=#2e2e34
; 强边框：聚焦控件、强调卡片、较清晰的轮廓。
borderStrong=#3d3d45
; 主文字：正文、标题、主要按钮文字。
text=#ececed
; 次级文字：状态、提示、标签。
textMuted=#9fa0a6
; 弱文字：辅助信息、关闭按钮普通态、低优先级提示。
textDim=#6d6e75
; 强调色：运行状态、链接、左侧强调线、主要视觉焦点。
accent=#5ab4ad
; 强调色 hover：链接 hover、强调按钮 hover。
accentHover=#6fc9c1
; 错误文字色：错误状态、危险提示。
error=#e07070
; 错误背景色：错误卡片、停止/失败相关背景。
errorBg=#2a1919
; 警告文字色：警告状态、需要注意的信息。
warning=#d8b165
; 警告背景色：警告卡片背景。
warningBg=#2b2417
; 滚动条普通态。
scrollbar=#3d3d45
; 滚动条 hover 态。
scrollbarHover=#4e4e57

[agentTheme]
; Markdown 代码块背景。
codeBlockBg=#161618
; Markdown 代码块文字。
codeBlockText=#e8e8ea
; Markdown 代码块边框。
codeBlockBorder=#2e2e34
; Send 按钮背景。
sendBtn=#2e807a
; Send 按钮 hover 背景。
sendBtnHover=#379089
; Send / Stop 按钮文字。
sendBtnText=#ffffff
; ACP decision primary button background.
decisionPrimary=#2e807a
; ACP decision primary button hover background.
decisionPrimaryHover=#379089
; ACP decision primary button text.
decisionPrimaryText=#ffffff
; Stop 按钮背景。
stopBtn=#7b3835
; Stop 按钮 hover 背景。
stopBtnHover=#8d4642
; 权限决策按钮：允许。
allowColor=#6bbf8a
; 权限决策按钮：拒绝。
denyColor=#e07070
; 权限决策按钮：始终允许/谨慎操作。
cautionColor=#d8b165
; 权限请求卡片背景。
permissionBg=#22201a
; 权限请求卡片边框。
permissionBorder=#5a5030
; 需要用户输入/选择的 elicitation 卡片背景。
elicitationBg=#16201e
; 需要用户输入/选择的 elicitation 卡片边框。
elicitationBorder=#3a5551
; 图片预览、遮罩层等覆盖色。
overlay=#000000
; 弹出层和菜单阴影色。
shadow=#000000
; 输入框聚焦光环。
focusRing=#5ab4ad

[terminalColors]
; 终端默认前景文字色。
foreground=#cdd6f4
; 终端光标颜色。
cursor=#f5e0dc
; 光标反色文字色。
cursorAccent=#0c0c0d
; 终端选区背景，末尾 66 表示透明度。
selectionBackground=#585b7066
; 终端选区文字色。
selectionForeground=#cdd6f4
; ANSI 基础色：黑。
black=#45475a
; ANSI 基础色：红。
red=#f38ba8
; ANSI 基础色：绿。
green=#a6e3a1
; ANSI 基础色：黄。
yellow=#f9e2af
; ANSI 基础色：蓝。
blue=#89b4fa
; ANSI 基础色：紫。
magenta=#f5c2e7
; ANSI 基础色：青。
cyan=#94e2d5
; ANSI 基础色：白。
white=#bac2de
; ANSI 高亮色：亮黑/灰。
brightBlack=#585b70
; ANSI 高亮色：亮红。
brightRed=#f38ba8
; ANSI 高亮色：亮绿。
brightGreen=#a6e3a1
; ANSI 高亮色：亮黄。
brightYellow=#f9e2af
; ANSI 高亮色：亮蓝。
brightBlue=#89b4fa
; ANSI 高亮色：亮紫。
brightMagenta=#f5c2e7
; ANSI 高亮色：亮青。
brightCyan=#94e2d5
; ANSI 高亮色：亮白。
brightWhite=#a6adc8
