; PSX 主题文件（Theme Preset），可在 Theme 菜单中预览并应用。
; 修改后请刷新主题列表；只有点击“确认使用”才会写入核心配置。
; 使用方法：关闭 PSX，把本文件复制到上一级目录，并重命名为 psx.ini，然后重新启动。
; 注意：PSX 实际只读取上一级目录的 psx.ini，本文件只是模板。

[meta]
kind=theme
schemaVersion=1
id=terminal-green
name=Terminal Green
author=PSX

[terminal]
; 终端字体大小，影响 Terminal 面板里的 xterm 字号。
fontSize=14
; 终端字体族，建议保留等宽字体在最前面。
fontFamily=Cascadia Code, Consolas, monospace
; 终端历史滚动行数。
; 保留字段，目前主题颜色主要由下方 [theme] 和 [terminalColors] 控制。

[agent]
; AI Agent 面板的界面字号。
fontSize=14
; AI Agent 面板的普通 UI 字体。
fontFamily=Segoe UI Variable Text, Segoe UI, Microsoft YaHei UI, Microsoft JhengHei UI, Yu Gothic UI, Meiryo, Segoe UI Emoji, sans-serif
; AI Agent 面板中代码块、工具输出和其他技术内容使用的等宽字体。
monoFontFamily=PSX Maple Mono, Segoe UI Emoji, Microsoft YaHei UI, monospace

; 新建终端默认使用的 shell 配置。

[theme]
; 整体主背景：WPF 内容区、Agent 主背景、Terminal 页面背景。
background=#171a18
; 普通表面：输入框、普通卡片、按钮底色。
surface=#1e221f
; 抬高表面：工具卡片、弹出层、较突出的面板。
surfaceRaised=#262b27
; 弱表面：选中状态、次级块、折叠内容背景。
surfaceMuted=#2e332f
; 悬停背景：Tab hover、按钮 hover、列表项 hover。
hover=#343a35
; 普通边框：卡片、输入框、分隔线。
border=#3b423c
; 强边框：聚焦控件、强调卡片、较清晰的轮廓。
borderStrong=#4f574f
; 主文字：正文、标题、主要按钮文字。
text=#e3e7e1
; 次级文字：状态、提示、标签。
textMuted=#a6ada5
; 弱文字：辅助信息、关闭按钮普通态、低优先级提示。
textDim=#767d75
; 强调色：运行状态、链接、左侧强调线、主要视觉焦点。
accent=#8fa98c
; 强调色 hover：链接 hover、强调按钮 hover。
accentHover=#a2bb9e
; 错误文字色：错误状态、危险提示。
error=#c98d8d
; 错误背景色：错误卡片、停止/失败相关背景。
errorBg=#2a2020
; 警告文字色：警告状态、需要注意的信息。
warning=#c4a978
; 警告背景色：警告卡片背景。
warningBg=#2a2518
; 滚动条普通态。
scrollbar=#3b423c
; 滚动条 hover 态。
scrollbarHover=#4f574f

[agentTheme]
; Markdown 代码块背景。
codeBlockBg=#141712
; Markdown 代码块文字。
codeBlockText=#d8e0d5
; Markdown 代码块边框。
codeBlockBorder=#3b423c
; Send 按钮背景。
sendBtn=#5c7d6c
; Send 按钮 hover 背景。
sendBtnHover=#6b8f7c
; Send / Stop 按钮文字。
sendBtnText=#ffffff
; ACP decision primary button background.
decisionPrimary=#5c7d6c
; ACP decision primary button hover background.
decisionPrimaryHover=#6b8f7c
; ACP decision primary button text.
decisionPrimaryText=#ffffff
; Stop 按钮背景。
stopBtn=#8a4a4a
; Stop 按钮 hover 背景。
stopBtnHover=#9c5555
; 权限决策按钮：允许。
allowColor=#86b393
; 权限决策按钮：拒绝。
denyColor=#cf8f8f
; 权限决策按钮：始终允许/谨慎操作。
cautionColor=#c9b079
; 权限请求卡片背景。
permissionBg=#262316
; 权限请求卡片边框。
permissionBorder=#6f6238
; 需要用户输入/选择的 elicitation 卡片背景。
elicitationBg=#182420
; 需要用户输入/选择的 elicitation 卡片边框。
elicitationBorder=#4a6b62
; 图片预览、遮罩层等覆盖色。
overlay=#000000
; 弹出层和菜单阴影色。
shadow=#000000
; 输入框聚焦光环。
focusRing=#8fa98c
; Agent 工作台底色渐变着色（RRGGBBAA，全透明=无着色）。
workbenchTint=#00000000

[terminalColors]
; 终端默认前景文字色。
foreground=#d8e0d5
; 终端光标颜色。
cursor=#8fa98c
; 光标反色文字色。
cursorAccent=#171a18
; 终端选区背景，末尾 88 表示透明度。
selectionBackground=#3b423c88
; 终端选区文字色。
selectionForeground=#e3e7e1
; ANSI 基础色：黑。
black=#1d2a23
; ANSI 基础色：红。
red=#cf8f8f
; ANSI 基础色：绿。
green=#8fa98c
; ANSI 基础色：黄。
yellow=#c9b079
; ANSI 基础色：蓝。
blue=#8fa6c4
; ANSI 基础色：紫。
magenta=#b39ac4
; ANSI 基础色：青。
cyan=#8fc4b8
; ANSI 基础色：白。
white=#e3e7e1
; ANSI 高亮色：亮黑/灰。
brightBlack=#6f8d7d
; ANSI 高亮色：亮红。
brightRed=#d9a0a0
; ANSI 高亮色：亮绿。
brightGreen=#a2bb9e
; ANSI 高亮色：亮黄。
brightYellow=#d8c290
; ANSI 高亮色：亮蓝。
brightBlue=#a2b8d2
; ANSI 高亮色：亮紫。
brightMagenta=#c4aed2
; ANSI 高亮色：亮青。
brightCyan=#a2d2c6
; ANSI 高亮色：亮白。
brightWhite=#eef0ec
