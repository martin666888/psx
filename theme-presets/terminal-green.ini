; PSX 主题文件（Theme Preset），可在 Theme 菜单中预览并应用。
; 修改后请刷新主题列表；只有点击“确认使用”才会写入核心配置。
; 使用方法：关闭 PSX，把本文件复制到上一级目录，并重命名为 psx.ini，然后重新启动。
; 注意：PSX 实际只读取上一级目录的 psx.ini，本文件只是模板。

[meta]
kind=theme
schemaVersion=1
id=terminal-green
name=Terminal Green
author=PSX

[terminal]
; 终端字体大小，影响 Terminal 面板里的 xterm 字号。
fontSize=14
; 终端字体族，建议保留等宽字体在最前面。
fontFamily=Cascadia Code, Consolas, monospace
; 终端历史滚动行数。
; 保留字段，目前主题颜色主要由下方 [theme] 和 [terminalColors] 控制。

[agent]
; AI Agent 面板的界面字号。
fontSize=14
; AI Agent 面板的普通 UI 字体。
fontFamily=Segoe UI Variable, Segoe UI, Microsoft YaHei UI, Microsoft YaHei, sans-serif
; AI Agent 面板中代码块、工具输出、输入框使用的等宽字体。
monoFontFamily=Cascadia Code, Consolas, monospace

; 新建终端默认使用的 shell 配置。

[theme]
; 整体主背景：WPF 内容区、Agent 主背景、Terminal 页面背景。
background=#101713
; 普通表面：输入框、普通卡片、按钮底色。
surface=#16211b
; 抬高表面：工具卡片、弹出层、较突出的面板。
surfaceRaised=#1b2a22
; 弱表面：选中状态、次级块、折叠内容背景。
surfaceMuted=#24362c
; 悬停背景：Tab hover、按钮 hover、列表项 hover。
hover=#2b4034
; 普通边框：卡片、输入框、分隔线。
border=#345241
; 强边框：聚焦控件、强调卡片、较清晰的轮廓。
borderStrong=#4d755f
; 主文字：正文、标题、主要按钮文字。
text=#d8eadf
; 次级文字：状态、提示、标签。
textMuted=#99b9a8
; 弱文字：辅助信息、关闭按钮普通态、低优先级提示。
textDim=#6f8d7d
; 强调色：运行状态、链接、左侧强调线、主要视觉焦点。
accent=#54d18a
; 强调色 hover：链接 hover、强调按钮 hover。
accentHover=#72e5a3
; 错误文字色：错误状态、危险提示。
error=#f06f6f
; 错误背景色：错误卡片、停止/失败相关背景。
errorBg=#351d1d
; 警告文字色：警告状态、需要注意的信息。
warning=#d8b95f
; 警告背景色：警告卡片背景。
warningBg=#312815
; 滚动条普通态。
scrollbar=#345241
; 滚动条 hover 态。
scrollbarHover=#4d755f

[agentTheme]
; Markdown 代码块背景。
codeBlockBg=#0b120e
; Markdown 代码块文字。
codeBlockText=#c8f7d8
; Markdown 代码块边框。
codeBlockBorder=#345241
; Send 按钮背景。
sendBtn=#1f784a
; Send 按钮 hover 背景。
sendBtnHover=#258654
; Send / Stop 按钮文字。
sendBtnText=#ffffff
; ACP decision primary button background.
decisionPrimary=#1f784a
; ACP decision primary button hover background.
decisionPrimaryHover=#258654
; ACP decision primary button text.
decisionPrimaryText=#ffffff
; Stop 按钮背景。
stopBtn=#8f3a3a
; Stop 按钮 hover 背景。
stopBtnHover=#aa4949
; 权限决策按钮：允许。
allowColor=#54d18a
; 权限决策按钮：拒绝。
denyColor=#f06f6f
; 权限决策按钮：始终允许/谨慎操作。
cautionColor=#d8b95f
; 权限请求卡片背景。
permissionBg=#251f13
; 权限请求卡片边框。
permissionBorder=#8e7738
; 需要用户输入/选择的 elicitation 卡片背景。
elicitationBg=#132621
; 需要用户输入/选择的 elicitation 卡片边框。
elicitationBorder=#3e806d
; 图片预览、遮罩层等覆盖色。
overlay=#000000
; 弹出层和菜单阴影色。
shadow=#000000
; 输入框聚焦光环。
focusRing=#54d18a

[terminalColors]
; 终端默认前景文字色。
foreground=#c8f7d8
; 终端光标颜色。
cursor=#54d18a
; 光标反色文字色。
cursorAccent=#101713
; 终端选区背景，末尾 88 表示透明度。
selectionBackground=#34524188
; 终端选区文字色。
selectionForeground=#e8fff0
; ANSI 基础色：黑。
black=#1d2a23
; ANSI 基础色：红。
red=#f06f6f
; ANSI 基础色：绿。
green=#54d18a
; ANSI 基础色：黄。
yellow=#d8b95f
; ANSI 基础色：蓝。
blue=#63a7ff
; ANSI 基础色：紫。
magenta=#c98cff
; ANSI 基础色：青。
cyan=#56d6c2
; ANSI 基础色：白。
white=#d8eadf
; ANSI 高亮色：亮黑/灰。
brightBlack=#6f8d7d
; ANSI 高亮色：亮红。
brightRed=#ff8a8a
; ANSI 高亮色：亮绿。
brightGreen=#72e5a3
; ANSI 高亮色：亮黄。
brightYellow=#e8cf79
; ANSI 高亮色：亮蓝。
brightBlue=#82bcff
; ANSI 高亮色：亮紫。
brightMagenta=#d9a8ff
; ANSI 高亮色：亮青。
brightCyan=#72ead9
; ANSI 高亮色：亮白。
brightWhite=#f0fff5
