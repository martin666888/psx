; PSX 主题文件（Theme Preset），可在 Theme 菜单中预览并应用。
; Vercel Neutral Light — 白底灰阶 + 黑色主操作，配合 CP2 shadcn 设计地基。

[meta]
kind=theme
schemaVersion=1
id=vercel-neutral-light
name=Vercel Neutral Light
author=PSX

[terminal]
fontSize=14
fontFamily=Cascadia Code, Consolas, monospace

[agent]
fontSize=14
fontFamily=Segoe UI Variable Text, Segoe UI, Microsoft YaHei UI, Microsoft JhengHei UI, Yu Gothic UI, Meiryo, Segoe UI Emoji, sans-serif
monoFontFamily=PSX Maple Mono, Segoe UI Emoji, Microsoft YaHei UI, monospace

[theme]
background=#ffffff
surface=#fafafa
surfaceRaised=#ffffff
surfaceMuted=#f5f5f5
hover=#f0f0f0
border=#e5e5e5
borderStrong=#d4d4d4
text=#171717
textMuted=#737373
textDim=#a3a3a3
accent=#171717
accentHover=#000000
error=#e7000b
errorBg=#fdecec
; 警告文字色：dark 预设的 #f5a623 与 Vercel 对齐，但白底对比度仅约 2.2:1，
; 过不了 ThemeService 的 CautionColor 3:1 诊断，故 light 用深棕——这是有意的亮暗分叉，勿「统一」。
warning=#a35200
warningBg=#fff4e5
scrollbar=#d4d4d4
scrollbarHover=#a3a3a3

[agentTheme]
codeBlockBg=#fafafa
codeBlockText=#171717
codeBlockBorder=#e5e5e5
sendBtn=#171717
sendBtnHover=#000000
sendBtnText=#ffffff
decisionPrimary=#171717
decisionPrimaryHover=#000000
decisionPrimaryText=#ffffff
stopBtn=#fbdcdd
stopBtnHover=#f5c2c4
allowColor=#297a3a
denyColor=#e7000b
cautionColor=#a35200
permissionBg=#fafafa
permissionBorder=#d4d4d4
elicitationBg=#f4faf9
elicitationBorder=#cfe5e1
overlay=#000000
shadow=#000000
focusRing=#1f7a72
workbenchTint=#f9f1ebcc

[terminalColors]
foreground=#171717
cursor=#171717
cursorAccent=#ffffff
selectionBackground=#b3d7ff88
selectionForeground=#171717
black=#000000
red=#e7000b
green=#297a3a
yellow=#a35200
blue=#0068d6
magenta=#7d00cc
cyan=#0087a8
white=#d4d4d4
brightBlack=#525252
brightRed=#ff6467
brightGreen=#3fa354
brightYellow=#d17d00
brightBlue=#52a8ff
brightMagenta=#bf7af0
brightCyan=#00b3d6
brightWhite=#fafafa
