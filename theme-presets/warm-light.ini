; PSX Theme Preset: Warm Light
; 使用方法：关闭 PSX，把本文件复制到上一级目录，并重命名为 psx.ini，然后重新启动。
; 注意：PSX 实际只读取上一级目录的 psx.ini，本文件只是模板。

[terminal]
; 终端字体大小，影响 Terminal 面板里的 xterm 字号。
fontSize=14
; 终端字体族，建议保留等宽字体在最前面。
fontFamily=Cascadia Code, Consolas, monospace
; 终端历史滚动行数。
scrollback=10000
; 保留字段，目前主题颜色主要由下方 [theme] 和 [terminalColors] 控制。
theme=dark

[agent]
; AI Agent 面板的界面字号。
fontSize=14
; AI Agent 面板的普通 UI 字体。
fontFamily=Cascadia Code, Segoe UI, Microsoft YaHei UI, Microsoft YaHei, sans-serif
; AI Agent 面板中代码块、工具输出、输入框使用的等宽字体。
monoFontFamily=Cascadia Code, Consolas, monospace

[shell]
; 新建终端默认使用的 shell 配置。
defaultProfile=powershell

[theme]
; 整体主背景：WPF 内容区、Agent 主背景、Terminal 页面背景。
background=#f5f0e8
; 普通表面：输入框、普通卡片、按钮底色。
surface=#ebe5da
; 抬高表面：工具卡片、弹出层、较突出的面板。
surfaceRaised=#e0d9cc
; 弱表面：选中状态、次级块、折叠内容背景。
surfaceMuted=#d5cec0
; 悬停背景：Tab hover、按钮 hover、列表项 hover。
hover=#d0c9bb
; 普通边框：卡片、输入框、分隔线。
border=#c4bcae
; 强边框：聚焦控件、强调卡片、较清晰的轮廓。
borderStrong=#a89f90
; 主文字：正文、标题、主要按钮文字。
text=#2c2a25
; 次级文字：状态、提示、标签。
textMuted=#6b655a
; 弱文字：辅助信息、关闭按钮普通态、低优先级提示。
textDim=#9a9285
; 强调色：运行状态、链接、左侧强调线、主要视觉焦点。
accent=#2e8a82
; 强调色 hover：链接 hover、强调按钮 hover。
accentHover=#3a9e95
; 错误文字色：错误状态、危险提示。
error=#c45050
; 错误背景色：错误卡片、停止/失败相关背景。
errorBg=#f5dede
; 警告文字色：警告状态、需要注意的信息。
warning=#b8923a
; 警告背景色：警告卡片背景。
warningBg=#f5ecd5
; 滚动条普通态。
scrollbar=#c4bcae
; 滚动条 hover 态。
scrollbarHover=#a89f90

[agentTheme]
; Markdown 代码块背景。
codeBlockBg=#e8e1d4
; Markdown 代码块文字。
codeBlockText=#3a352c
; Markdown 代码块边框。
codeBlockBorder=#c4bcae
; Send 按钮背景。
sendBtn=#2e8a82
; Send 按钮 hover 背景。
sendBtnHover=#3a9e95
; Send / Stop 按钮文字。
sendBtnText=#ffffff
; ACP decision primary button background.
decisionPrimary=#2e8a82
; ACP decision primary button hover background.
decisionPrimaryHover=#3a9e95
; ACP decision primary button text.
decisionPrimaryText=#ffffff
; Stop 按钮背景。
stopBtn=#c45050
; Stop 按钮 hover 背景。
stopBtnHover=#d46060
; 权限决策按钮：允许。
allowColor=#22c55e
; 权限决策按钮：拒绝。
denyColor=#ef4444
; 权限决策按钮：始终允许/谨慎操作。
cautionColor=#eab308
; 权限请求卡片背景。
permissionBg=#f0e8d5
; 权限请求卡片边框。
permissionBorder=#c4a855
; 需要用户输入/选择的 elicitation 卡片背景。
elicitationBg=#ddf0ec
; 需要用户输入/选择的 elicitation 卡片边框。
elicitationBorder=#5aa6a0
; 图片预览、遮罩层等覆盖色。
overlay=#000000
; 弹出层和菜单阴影色。
shadow=#000000
; 输入框聚焦光环。
focusRing=#2e8a82

[terminalColors]
; 终端默认前景文字色。
foreground=#3a352c
; 终端光标颜色。
cursor=#2c2a25
; 光标反色文字色。
cursorAccent=#f5f0e8
; 终端选区背景，末尾 88 表示透明度。
selectionBackground=#c4bcae88
; 终端选区文字色。
selectionForeground=#2c2a25
; ANSI 基础色：黑。
black=#6b655a
; ANSI 基础色：红。
red=#c45050
; ANSI 基础色：绿。
green=#4a8a5a
; ANSI 基础色：黄。
yellow=#b8923a
; ANSI 基础色：蓝。
blue=#4a7ab5
; ANSI 基础色：紫。
magenta=#9a5aaa
; ANSI 基础色：青。
cyan=#2e8a82
; ANSI 基础色：白。
white=#d5cec0
; ANSI 高亮色：亮黑/灰。
brightBlack=#9a9285
; ANSI 高亮色：亮红。
brightRed=#d46060
; ANSI 高亮色：亮绿。
brightGreen=#5aa06a
; ANSI 高亮色：亮黄。
brightYellow=#caa24a
; ANSI 高亮色：亮蓝。
brightBlue=#5a8ac5
; ANSI 高亮色：亮紫。
brightMagenta=#aa6aba
; ANSI 高亮色：亮青。
brightCyan=#3a9e95
; ANSI 高亮色：亮白。
brightWhite=#ebe5da
