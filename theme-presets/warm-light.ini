; PSX 主题文件（Theme Preset），可在 Theme 菜单中预览并应用。
; 修改后请刷新主题列表；只有点击“确认使用”才会写入核心配置。
; 使用方法：关闭 PSX，把本文件复制到上一级目录，并重命名为 psx.ini，然后重新启动。
; 注意：PSX 实际只读取上一级目录的 psx.ini，本文件只是模板。

[meta]
kind=theme
schemaVersion=1
id=warm-light
name=Warm Light
author=PSX

[terminal]
; 终端字体大小，影响 Terminal 面板里的 xterm 字号。
fontSize=14
; 终端字体族，建议保留等宽字体在最前面。
fontFamily=Cascadia Code, Consolas, monospace
; 终端历史滚动行数。
; 保留字段，目前主题颜色主要由下方 [theme] 和 [terminalColors] 控制。

[agent]
; AI Agent 面板的界面字号。
fontSize=14
; AI Agent 面板的普通 UI 字体。
fontFamily=Segoe UI Variable, Segoe UI, Microsoft YaHei UI, Microsoft YaHei, sans-serif
; AI Agent 面板中代码块、工具输出、输入框使用的等宽字体。
monoFontFamily=Cascadia Code, Consolas, monospace

; 新建终端默认使用的 shell 配置。

[theme]
; 整体主背景：WPF 内容区、Agent 主背景、Terminal 页面背景。
background=#ffffff
; 普通表面：输入框、普通卡片、按钮底色。
surface=#f5f6f8
; 抬高表面：工具卡片、弹出层、较突出的面板。
surfaceRaised=#ffffff
; 弱表面：选中状态、次级块、折叠内容背景。
surfaceMuted=#edeef1
; 悬停背景：Tab hover、按钮 hover、列表项 hover。
hover=#eaecef
; 普通边框：卡片、输入框、分隔线。
border=#dde1e6
; 强边框：聚焦控件、强调卡片、较清晰的轮廓。
borderStrong=#c2c8d0
; 主文字：正文、标题、主要按钮文字。
text=#1f2328
; 次级文字：状态、提示、标签。
textMuted=#57606a
; 弱文字：辅助信息、关闭按钮普通态、低优先级提示。
textDim=#8b939d
; 强调色：运行状态、链接、左侧强调线、主要视觉焦点。
accent=#1f7a72
; 强调色 hover：链接 hover、强调按钮 hover。
accentHover=#185f59
; 错误文字色：错误状态、危险提示。
error=#b23b3b
; 错误背景色：错误卡片、停止/失败相关背景。
errorBg=#fcecec
; 警告文字色：警告状态、需要注意的信息。
warning=#8a6714
; 警告背景色：警告卡片背景。
warningBg=#faf1d6
; 滚动条普通态。
scrollbar=#ced3d9
; 滚动条 hover 态。
scrollbarHover=#b0b7bf

[agentTheme]
; Markdown 代码块背景。
codeBlockBg=#f4f6f8
; Markdown 代码块文字。
codeBlockText=#1f2328
; Markdown 代码块边框。
codeBlockBorder=#dde1e6
; Send 按钮背景。
sendBtn=#1f7a72
; Send 按钮 hover 背景。
sendBtnHover=#185f59
; Send / Stop 按钮文字。
sendBtnText=#ffffff
; ACP decision primary button background.
decisionPrimary=#1f7a72
; ACP decision primary button hover background.
decisionPrimaryHover=#185f59
; ACP decision primary button text.
decisionPrimaryText=#ffffff
; Stop 按钮背景。
stopBtn=#b23b3b
; Stop 按钮 hover 背景。
stopBtnHover=#9c3333
; 权限决策按钮：允许。
allowColor=#1f7a4a
; 权限决策按钮：拒绝。
denyColor=#b23b3b
; 权限决策按钮：始终允许/谨慎操作。
cautionColor=#8a6714
; 权限请求卡片背景。
permissionBg=#fbf4e0
; 权限请求卡片边框。
permissionBorder=#cbb273
; 需要用户输入/选择的 elicitation 卡片背景。
elicitationBg=#e6f2ef
; 需要用户输入/选择的 elicitation 卡片边框。
elicitationBorder=#1f7a72
; 图片预览、遮罩层等覆盖色。
overlay=#000000
; 弹出层和菜单阴影色。
shadow=#2a3138
; 输入框聚焦光环。
focusRing=#1f7a72

[terminalColors]
; 终端默认前景文字色。
foreground=#1f2328
; 终端光标颜色。
cursor=#1f2328
; 光标反色文字色。
cursorAccent=#ffffff
; 终端选区背景，末尾 88 表示透明度。
selectionBackground=#c2c8d066
; 终端选区文字色。
selectionForeground=#1f2328
; ANSI 基础色：黑。
black=#6b655a
; ANSI 基础色：红。
red=#c45050
; ANSI 基础色：绿。
green=#4a8a5a
; ANSI 基础色：黄。
yellow=#b8923a
; ANSI 基础色：蓝。
blue=#4a7ab5
; ANSI 基础色：紫。
magenta=#9a5aaa
; ANSI 基础色：青。
cyan=#2e8a82
; ANSI 基础色：白。
white=#d5cec0
; ANSI 高亮色：亮黑/灰。
brightBlack=#9a9285
; ANSI 高亮色：亮红。
brightRed=#d46060
; ANSI 高亮色：亮绿。
brightGreen=#5aa06a
; ANSI 高亮色：亮黄。
brightYellow=#caa24a
; ANSI 高亮色：亮蓝。
brightBlue=#5a8ac5
; ANSI 高亮色：亮紫。
brightMagenta=#aa6aba
; ANSI 高亮色：亮青。
brightCyan=#3a9e95
; ANSI 高亮色：亮白。
brightWhite=#ebe5da
