<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>PSX Terminal</title>
  <script type="module" crossorigin src="/app/assets/index-CxlgSPIm.js"></script>
  <link rel="stylesheet" crossorigin href="/app/assets/index-PEaVh_fS.css">
</head>
<body>
    <div id="terminal-container"></div>
    <div id="agent-workspace-container"></div>
    <template id="agent-workspace-template">
    <section class="agent-panel" hidden>
        <header class="agent-toolbar">
            <div data-role="toolbar-host" class="agent-toolbar-host"></div>
        </header>
        <div data-role="runtime-host" class="agent-runtime-react-host"></div>
        <div class="agent-workspace">
            <div data-role="conversation-host" class="agent-conversation-host"></div>
        </div>

                <aside data-role="context-cards" class="agent-context-cards" aria-label="Agent context cards">
            <section data-role="plan-card" class="agent-plan-card" aria-label="Agent plan"></section>
        </aside>
        <footer class="agent-composer">
            <div data-role="composer-host" class="agent-composer-host"></div>
        </footer>
    </section>
    </template>

    <script>
        window.onerror = function(msg, src, line, col, err) {
            var d = document.createElement('pre');
            d.className = 'agent-native-scroll';
            d.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#f38ba8;color:#1e1e2e;font-size:12px;padding:8px;z-index:9999;white-space:pre-wrap;max-height:40vh;overflow:auto';
            d.textContent = '[JS ERROR] ' + msg + '\n  at ' + src + ':' + line + ':' + col + (err ? '\n' + err.stack : '');
            document.body.appendChild(d);
            return false;
        };
        window.addEventListener('unhandledrejection', function(e) {
            window.onerror('Unhandled Promise: ' + e.reason, '', 0, 0, e.reason instanceof Error ? e.reason : null);
        });
    </script>
</body>
</html>
