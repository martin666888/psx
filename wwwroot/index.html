<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="https://psx.local/">
    <link rel="stylesheet" href="vendor/xterm/xterm.css">
    <link rel="stylesheet" href="css/terminal.css">
    <link rel="stylesheet" href="css/agent/index.css">
    <link rel="icon" href="data:,">
    <title>PSX Terminal</title>
</head>
<body>
    <div id="terminal-container"></div>
    <div id="agent-workspace-container"></div>
    <template id="agent-workspace-template">
    <section class="agent-panel" hidden>
        <header class="agent-toolbar">
            <div class="agent-meta">
                <span data-role="status">Ready</span>
                <span data-role="cwd">Working directory not loaded</span>
                <button data-role="change-cwd" class="agent-link-button" type="button">Change</button>
                <span data-role="session"></span>
            </div>
            <div class="agent-toolbar-actions">
                <button data-role="clear" title="Clear thread">Clear</button>
            </div>
        </header>
        <section data-role="runtime-card"
                 class="agent-runtime-card"
                 aria-live="polite"
                 hidden>
            <div class="agent-runtime-indicator" aria-hidden="true"></div>
            <div class="agent-runtime-copy">
                <h2 data-role="runtime-title">Agent runtime required</h2>
                <p data-role="runtime-message">Install the Agent runtime before starting a session.</p>
                <p class="agent-runtime-note">Downloads pinned components from the official npm registry into this PSX folder and reuses them on later launches.</p>
            </div>
            <div class="agent-runtime-actions">
                <button data-role="runtime-install" type="button">Install runtime</button>
                <button data-role="runtime-cancel" type="button" hidden>Cancel</button>
            </div>
        </section>
        <div class="agent-workspace">
            <main data-role="thread" class="agent-thread" role="log" aria-label="Agent conversation" aria-live="polite" aria-relevant="additions"></main>
        </div>

        <aside data-role="context-cards" class="agent-context-cards" aria-label="Agent context cards">
            <div data-role="plan-resizer"
                 class="agent-plan-resizer"
                 role="separator"
                 aria-label="Resize Agent plan"
                 aria-orientation="vertical"
                 tabindex="0"></div>
            <section data-role="plan-card" class="agent-plan-card" aria-label="Agent plan">
                <header class="agent-plan-card-header">
                    <strong class="agent-plan-card-title">Plan</strong>
                    <button data-role="plan-pin"
                            class="agent-plan-pin"
                            type="button"
                            title="Pin the Plan card"
                            aria-pressed="false">Pin</button>
                    <button data-role="plan-close"
                            class="agent-plan-close"
                            type="button"
                            title="Close the Plan card"
                            aria-label="Close the Plan card">&times;</button>
                </header>
                <div data-role="plan-panel" class="agent-plan-panel"></div>
            </section>
            <button data-role="plan-entry"
                    class="agent-plan-entry"
                    type="button"
                    hidden>
                <span>Plan</span>
                <span data-role="plan-unread" class="agent-plan-unread" aria-label="Plan updated" hidden></span>
            </button>
        </aside>
        <footer class="agent-composer">
            <div class="agent-composer-main">
                <div data-role="attachments-strip" class="agent-attachments-strip" hidden></div>
                <section data-role="mode-transition-prompt"
                         class="agent-composer-mode-transition"
                         aria-label="Agent decision"
                         hidden></section>
                <div data-role="input-row" class="agent-input-row">
                    <button data-role="attach" class="agent-attach" type="button" title="Attach images" aria-label="Attach images">+</button>
                    <input data-role="attachment-input" type="file" accept="image/*" multiple hidden>
                    <textarea data-role="input"
                              rows="1"
                              spellcheck="false"
                              role="combobox"
                              aria-autocomplete="list"
                              aria-haspopup="listbox"
                              aria-expanded="false"
                              aria-label="Message Agent"
                              placeholder="Message Agent - / for commands"></textarea>
                    <button data-role="send" class="agent-send" type="button" title="Send message">Send</button>
                </div>
                <div data-role="command-hint" class="agent-command-hint" role="status" aria-live="polite" hidden></div>
                <div data-role="command-menu" class="agent-command-menu" role="listbox" aria-label="Available commands" hidden></div>
                <div class="agent-composer-footer">
                    <div class="agent-hints">
                        <span>/ commands</span>
                        <span data-role="context-used">Context used --k</span>
                    </div>
                    <label class="agent-mode-control" title="Agent mode">
                        <span>mode</span>
                        <select data-role="mode" disabled>
                            <option value="">default</option>
                        </select>
                    </label>
                    <div data-role="config-options" class="agent-config-options"></div>
                </div>
            </div>
        </footer>
        <dialog data-role="image-preview" class="agent-image-preview" aria-label="Image preview">
            <button data-role="image-preview-close" class="agent-image-preview-close" type="button" aria-label="Close image preview">&times;</button>
            <img data-role="image-preview-img" alt="Image preview">
        </dialog>
    </section>
    </template>

    <script>
        window.onerror = function(msg, src, line, col, err) {
            var d = document.createElement('pre');
            d.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#f38ba8;color:#1e1e2e;font-size:12px;padding:8px;z-index:9999;white-space:pre-wrap;max-height:40vh;overflow:auto';
            d.textContent = '[JS ERROR] ' + msg + '\n  at ' + src + ':' + line + ':' + col + (err ? '\n' + err.stack : '');
            document.body.appendChild(d);
            return false;
        };
        window.addEventListener('unhandledrejection', function(e) {
            window.onerror('Unhandled Promise: ' + e.reason, '', 0, 0, e.reason instanceof Error ? e.reason : null);
        });
    </script>
    <script src="vendor/xterm/xterm.js"></script>
    <script src="vendor/xterm/addon-fit.js"></script>
    <script src="vendor/xterm/addon-unicode11.js"></script>
    <script src="vendor/xterm/addon-webgl.js"></script>
    <script src="js/BridgeMessages.js"></script>
    <script src="js/Bridge.js"></script>
    <script src="js/TerminalManager.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
